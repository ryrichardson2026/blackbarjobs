name: Scheduled feed refresh (3x/week)

on:
  schedule:
    - cron: '0 14 * * 2,4,6'  # Tue/Thu/Sat 14:00 UTC (~9am Central, 7am Pacific)
  workflow_dispatch: {}        # adds a manual "Run workflow" button

permissions:
  contents: write              # lets the action commit the refreshed feed

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Fetch jobs into Supabase
        env:
          SEARCHAPI_KEY: ${{ secrets.SEARCHAPI_KEY }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python automation/bbj_feed_fetch.py --queries automation/bbj_feed_queries.json --staleness-days 7 --max-posted-age 14

      - name: Build feed snapshot
        env:
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: python automation/bbj_feed_snapshot.py --targets automation/bbj_page_targets.json --out feed

      # Bake the just-refreshed feed into the static HTML so crawlable cards stay in
      # sync with feed/*.json (keeps Lever 1 fresh and the audit's bake-lag check ~0).
      # walk-dir bakes every page by its own BBJ_FEED_KEY (manifest-independent, so it
      # covers DFW/Austin whose manifests are stale). No secrets: it only transforms
      # local feed JSON into HTML. --no-sitemap keeps the commit scoped to feed + pages.
      - name: Bake feed into static HTML
        run: python bbj_feed_bake.py --repo . --walk-dir . --market all --no-sitemap

      - name: Commit and push refreshed feed + baked pages
        id: commit
        run: |
          git config user.name "bbj-feed-bot"
          git config user.email "actions@users.noreply.github.com"
          git add feed
          git add -u
          # git add -u self-scopes to exactly what the refresh + bake changed (feed JSON
          # + baked .html), so a new market is covered with no path list to maintain.
          # Guard (not a filter): if anything OTHER than feed/ or a .html is staged, stop
          # loudly rather than sweep it in. --no-sitemap on the bake keeps sitemap.xml out.
          staged=$(git diff --cached --name-only)
          bad=$(echo "$staged" | grep -vE '^(feed/|.*\.html$)' || true)
          if [ -n "$bad" ]; then
            echo "Unexpected staged files:"; echo "$bad"; exit 1
          fi
          # Idempotent bake + unchanged feeds can legitimately stage nothing: clean no-op.
          if git diff --cached --quiet; then
            echo "No changes to commit"
            echo "committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: scheduled feed refresh + bake"
          git push
          echo "committed=true" >> "$GITHUB_OUTPUT"

      # Tell Google's Indexing API which pages changed this run so recrawl is
      # prompted instead of waiting weeks (indexed count fell 398 -> 296 while
      # pages rebaked without being recrawled). Only pages carrying JobPosting
      # qualify, which every BBJ hub/role page does. The ping script reads the
      # .html files changed in the just-pushed commit, resolves each to its
      # canonical URL, HEAD-checks it is live 200, and submits URL_UPDATED.
      #
      # Guards: runs only when the bake actually committed (no-op runs skip it),
      # and only if GOOGLE_INDEXING_KEY exists, so this step is safe to merge
      # before the GCP/Search-Console setup is finished. continue-on-error means
      # an indexing hiccup never fails the feed pipeline.
      - name: Notify Google Indexing API of changed pages
        if: steps.commit.outputs.committed == 'true'
        continue-on-error: true
        env:
          GOOGLE_INDEXING_KEY: ${{ secrets.GOOGLE_INDEXING_KEY }}
        run: |
          if [ -z "$GOOGLE_INDEXING_KEY" ]; then
            echo "GOOGLE_INDEXING_KEY not set; skipping indexing ping"; exit 0
          fi
          python -m pip install --quiet google-auth
          # The pushed commit must be LIVE before Google is told, or Googlebot
          # fetches a stale page and the quota is wasted. Vercel builds this
          # static site in ~15-60s; 120s is a safe deploy margin (documented
          # delay, per the brief's "add a delay step and document it").
          echo "Waiting 120s for Vercel to deploy the pushed commit..."
          sleep 120
          python automation/bbj_indexing_ping.py --range HEAD~1..HEAD
