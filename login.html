<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign In | BlackBar Jobs</title>
<link rel="icon" type="image/x-icon" href="/favicon.ico">

<link rel="preload" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" as="style" onload="this.onload=null;this.rel='stylesheet'">

<script src="/js/supabase-config.js"></script>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --navy-deep: #000814;
    --navy-mid: #001D3D;
    --gold: #FFC300;
    --gold-hover: #FFD60A;
    --white: #ffffff;
    --charcoal: #1a1a1a;
    --muted: #5a6474;
    --border: #e2e5ea;
  }

  body {
    font-family: 'Barlow', sans-serif;
    background: var(--white);
    color: var(--charcoal);
    font-size: 16px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 200;
    background: var(--white); padding: 10px 20px;
    display: flex; align-items: center;
    border-bottom: 1px solid var(--border);
  }
  .nav-logo {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800; font-size: 1.25rem; color: #111;
    text-decoration: none; border-bottom: 9px solid #111;
    padding-bottom: 4px; display: inline-block;
  }
  .nav-logo span { color: #FFC300; }

  .page-wrap {
    min-height: 100vh;
    padding: 80px 20px 60px;
    display: flex;
    align-items: flex-start;
    justify-content: center;
  }

  .auth-card {
    width: 100%;
    max-width: 440px;
    padding-top: 24px;
  }

  .auth-eyebrow {
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 0.8rem;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--muted);
    margin-bottom: 6px;
  }

  .auth-title {
    font-family: 'Barlow Condensed', sans-serif;
    font-weight: 800;
    font-size: 2rem;
    color: var(--navy-deep);
    line-height: 1.1;
    margin-bottom: 6px;
  }

  .auth-sub {
    font-size: 0.9rem;
    color: var(--muted);
    margin-bottom: 28px;
  }

  input[type="email"],
  input[type="password"] {
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--border);
    border-radius: 8px;
    font-family: 'Barlow', sans-serif;
    font-size: 0.95rem;
    color: var(--charcoal);
    background: var(--white);
    outline: none;
    transition: border-color 0.15s;
    margin-bottom: 10px;
    display: block;
  }

  input:focus { border-color: var(--navy-mid); }
  input::placeholder { color: #a0aab4; }

  .field-label {
    font-size: 0.78rem;
    font-weight: 600;
    color: var(--muted);
    letter-spacing: 0.04em;
    text-transform: uppercase;
    margin-bottom: 4px;
    display: block;
  }

  .submit-btn {
    width: 100%;
    padding: 14px;
    background: var(--gold);
    color: var(--navy-deep);
    font-family: 'Barlow Condensed', sans-serif;
    font-size: 1.1rem;
    font-weight: 800;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    border: none;
    border-radius: 10px;
    cursor: pointer;
    transition: background 0.15s;
    margin-top: 6px;
  }

  .submit-btn:hover { background: var(--gold-hover); }
  .submit-btn:disabled { opacity: 0.4; cursor: not-allowed; }

  .err-msg {
    display: none;
    color: #e53935;
    font-size: 0.82rem;
    margin-bottom: 12px;
    padding: 10px 12px;
    background: #fff5f5;
    border-radius: 6px;
    border: 1px solid #fcc;
  }

  .signup-link {
    text-align: center;
    font-size: 0.88rem;
    color: var(--muted);
    margin-top: 20px;
  }

  .signup-link a {
    color: var(--navy-mid);
    font-weight: 600;
    text-decoration: none;
  }

  .signup-link a:hover { text-decoration: underline; }
</style>
</head>
<body>

<nav>
  <a href="/" class="nav-logo">BlackBar<span>Jobs</span></a>
</nav>

<div class="page-wrap">
  <div class="auth-card">

    <div class="auth-eyebrow">Security Officer Network</div>
    <h1 class="auth-title">Welcome back</h1>
    <p class="auth-sub">Sign in to manage your alerts and profile.</p>

    <div id="err-msg" class="err-msg"></div>

    <label class="field-label">Email</label>
    <input id="email" type="email" placeholder="you@email.com" autocomplete="email" inputmode="email">

    <label class="field-label">Password</label>
    <input id="password" type="password" placeholder="Your password" autocomplete="current-password">

    <button class="submit-btn" id="login-btn">Sign In →</button>

    <p class="signup-link">Don't have an account? <a href="/register.html">Create one free</a></p>

  </div>
</div>

<script>
  const sbClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  document.getElementById('login-btn').addEventListener('click', async () => {
    const email    = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;

    const errEl = document.getElementById('err-msg');
    errEl.style.display = 'none';

    if (!email || !password) {
      errEl.textContent = 'Please enter your email and password.';
      errEl.style.display = 'block';
      return;
    }

    const btn = document.getElementById('login-btn');
    btn.disabled = true;
    btn.textContent = 'Signing in...';

    const { data, error } = await sbClient.auth.signInWithPassword({ email, password });

    if (error) {
      errEl.textContent = error.message;
      errEl.style.display = 'block';
      btn.disabled = false;
      btn.textContent = 'Sign In →';
      return;
    }

    window.dataLayer = window.dataLayer || [];
    window.dataLayer.push({ event: 'user_login' });
    window.location.href = '/dashboard.html';
  });
</script>

</body>
</html>
