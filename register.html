<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account | BlackBar Jobs</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="/js/supabase-config.js"></script>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>

  <main style="max-width:480px;margin:60px auto;padding:0 20px;">
    <h1>Create Account</h1>

    <div id="error-msg" style="color:red;margin-bottom:12px;display:none;"></div>

    <input id="first_name" type="text" placeholder="First Name" style="width:100%;margin-bottom:10px;padding:10px;" /><br>
    <input id="last_name" type="text" placeholder="Last Name" style="width:100%;margin-bottom:10px;padding:10px;" /><br>
    <input id="email" type="email" placeholder="Email" style="width:100%;margin-bottom:10px;padding:10px;" /><br>
    <input id="phone" type="tel" placeholder="Phone (optional)" style="width:100%;margin-bottom:10px;padding:10px;" /><br>
    <input id="city" type="text" placeholder="City" style="width:100%;margin-bottom:10px;padding:10px;" /><br>
    <input id="state" type="text" placeholder="State" style="width:100%;margin-bottom:10px;padding:10px;" /><br>
    <input id="password" type="password" placeholder="Password" style="width:100%;margin-bottom:20px;padding:10px;" /><br>

    <button id="register-btn" style="width:100%;padding:12px;background:#FFC300;color:#000814;font-weight:bold;border:none;cursor:pointer;">
      Create Account
    </button>

    <p style="margin-top:16px;">Already have an account? <a href="/login.html">Sign In</a></p>
  </main>

  <script>
    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    document.getElementById('register-btn').addEventListener('click', async () => {
      const first_name = document.getElementById('first_name').value.trim();
      const last_name = document.getElementById('last_name').value.trim();
      const email = document.getElementById('email').value.trim();
      const phone = document.getElementById('phone').value.trim();
      const city = document.getElementById('city').value.trim();
      const state = document.getElementById('state').value.trim();
      const password = document.getElementById('password').value;

      const errEl = document.getElementById('error-msg');
      errEl.style.display = 'none';

      if (!first_name || !last_name || !email || !city || !state || !password) {
        errEl.textContent = 'Please fill in all required fields.';
        errEl.style.display = 'block';
        return;
      }

      const { data, error } = await supabase.auth.signUp({
        email,
        password,
        options: {
          data: { first_name, last_name, phone, city, state }
        }
      });

      if (error) {
        errEl.textContent = error.message;
        errEl.style.display = 'block';
        return;
      }

      window.location.href = '/dashboard.html';
    });
  </script>

</body>
</html>
